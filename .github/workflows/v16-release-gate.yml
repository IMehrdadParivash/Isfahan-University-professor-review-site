name: V16 Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tools/**'
      - 'V16_QA.md'
      - 'V16_FONT_QA.md'
      - 'CLOUDFLARE_PAGES.md'
      - '_headers'
      - '.github/workflows/v16-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-sanity:
    name: Static/offline sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required local references
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'assets/css/fonts.css').read_text(encoding='utf-8')

          required = [
              'assets/avatar/loader-avatar.webp',
              'assets/avatar/avatar-motion.js',
              'assets/css/fonts.css',
              'assets/css/ui-hotfix.css',
              'assets/js/app.js',
              'assets/js/ui-hotfix.js',
          ]
          failures = []
          for rel in required:
              if rel not in html:
                  failures.append(f'index.html does not reference {rel}')
              if not (root / rel).is_file():
                  failures.append(f'missing file: {rel}')

          external = re.findall(r'(?:src|href)=["\']https?://[^"\']+', html, flags=re.I)
          if external:
              failures.append('remote dependency in index.html: ' + ', '.join(external))

          css_external = re.findall(r'url\(["\']?https?://', css, flags=re.I)
          if css_external:
              failures.append('remote dependency in assets/css/fonts.css')

          if 'assets/fonts/' not in css and '../fonts/' not in css:
              failures.append('fonts.css is not wired to local font paths')

          if failures:
              print('\n'.join('FAIL: ' + x for x in failures))
              sys.exit(1)

          print('Static/offline sanity checks passed.')

      - name: Check release tooling syntax
        run: |
          python -m py_compile tools/install-v16-fonts.py tools/verify-v16-assets.py tools/stage-v16-release.py
          python tools/install-v16-fonts.py --help >/dev/null
          python tools/verify-v16-assets.py --help >/dev/null
          python tools/stage-v16-release.py --help >/dev/null

      - name: Upload source runtime bundle for staged-release QA
        uses: actions/upload-artifact@v4
        with:
          name: v16-source-runtime
          path: |
            index.html
            _headers
            assets/**
            tools/**
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Browser smoke — direct file mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Exercise V16 through file://
        run: python tools/browser-smoke-v16.py
      - name: Exercise UI hotfix regressions
        run: python tools/browser-ui-regression.py
      - name: Capture V16 QA screenshots
        if: success()
        run: python tools/capture-v16-screenshots.py
      - name: Upload V16 QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-qa-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

  source-assets:
    name: Source asset verification — license-safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify source assets and any repository fonts
        run: python tools/verify-v16-assets.py --allow-missing-fonts
