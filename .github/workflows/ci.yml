name: Website privacy, quality and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    name: Public data privacy, roster and executable hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject singleton evidence, PII, invalid URLs and incorrect hashes
        run: python tools/validate-data.py
      - name: Prove privacy validator rejects adversarial disclosure and tampering
        run: python tools/test-data-privacy.py

  static-sanity:
    name: Offline runtime, legal fonts and security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the local runtime and safe publication policy
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          root = Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'assets/css/fonts.css').read_text(encoding='utf-8')
          headers = (root / '_headers').read_text(encoding='utf-8')
          ignore = (root / '.gitignore').read_text(encoding='utf-8')
          failures = []

          required = [
              'assets/avatar/loader-avatar.webp',
              'assets/js/loader.js',
              'assets/css/fonts.css',
              'assets/css/app.css',
              'assets/js/app.js',
          ]
          for rel in required:
              if rel not in html:
                  failures.append(f'index.html does not reference {rel}')
              if not (root / rel).is_file():
                  failures.append(f'missing runtime file: {rel}')

          for rel in ('assets/fonts/Vazirmatn-Regular.woff2', 'assets/fonts/Vazirmatn-Bold.woff2', 'assets/fonts/OFL.txt', 'robots.txt'):
              if not (root / rel).is_file():
                  failures.append(f'missing legal-publication asset: {rel}')

          if 'SIL OPEN FONT LICENSE' not in (root / 'assets/fonts/OFL.txt').read_text(encoding='utf-8'):
              failures.append('Vazirmatn SIL Open Font License is missing')
          for name in ('Vazirmatn-Regular.woff2', 'Vazirmatn-Bold.woff2'):
              if name not in css:
                  failures.append(f'fonts.css does not use locally bundled {name}')

          external = re.findall(r'(?:src|href)=["\']https?://[^"\']+', html, flags=re.I)
          if external:
              failures.append('remote runtime dependency: ' + ', '.join(external))
          if re.search(r'url\(["\']?https?://', css, flags=re.I):
              failures.append('remote font CDN dependency')
          if 'Content-Security-Policy:' not in headers or "script-src 'self'" not in headers:
              failures.append('CSP does not restrict runtime JavaScript to local origin')
          if '/.release/' not in ignore:
              failures.append('.release directory is not ignored')

          scripts = re.findall(r'<script\s+src=["\']([^"\']+)["\']', html, flags=re.I)
          expected_scripts = [f'assets/data/professors-{index:02}.js' for index in range(1, 7)]
          expected_scripts += ['assets/js/app.js', 'assets/js/loader.js']
          if scripts != expected_scripts:
              failures.append(f'index.html must load only verified data and the two runtime scripts: {scripts}')
          obsolete = list(root.glob('V16*')) + list((root / 'assets/js').glob('data-*.js'))
          if obsolete:
              failures.append('obsolete versioned files in public repository: ' + ', '.join(str(path) for path in obsolete))

          commercial = [p for p in (root / 'assets/fonts').glob('*.woff2') if p.name.startswith(('RaviFaNum-', 'Anjoman-', 'Pinar-', 'Kahroba-'))]
          if commercial:
              failures.append('proprietary fonts in public repository: ' + ', '.join(str(p) for p in commercial))

          if failures:
              print('\n'.join('FAIL: ' + issue for issue in failures))
              sys.exit(1)
          print('Static/offline, security-header and font-license checks passed.')

      - name: Check all release and browser tooling syntax
        run: python -m compileall -q tools

      - name: Verify active executable files and real manifest hashes
        run: python tools/verify-assets.py

      - name: Exercise real data, filters, Persian search and dialogs in Node DOM
        run: node tools/test-ui-runtime.cjs

  release-safety:
    name: Adversarial safe staging and clean runtime allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject path traversal, external deletion, symlinks and tampered data
        run: python tools/test-release-safety.py
      - name: Build default privacy-safe Cloudflare Pages directory
        run: |
          python tools/build-release.py
          python tools/verify-assets.py --root .release/site
      - name: Upload exactly the verified static release
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: .release/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Real Chrome file-mode UI, accessibility and mobile regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Confirm Chrome is available on runner
        run: google-chrome --version
      - name: Exercise the full static runtime through file://
        run: python tools/test-browser.py
      - name: Check actual visible overlays, advanced filters and mobile layout
        run: python tools/test-browser-ui.py
      - name: Capture website QA screenshots
        if: success()
        run: python tools/capture-screenshots.py
      - name: Upload website QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-qa-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
